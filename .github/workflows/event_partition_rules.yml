name: Event Partition Rules

on: [push, pull_request]

jobs:
  event_partition_rules_tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: install Firebase emulator CLI
        run: npm install --global firebase-tools@14.11.1
      - name: event partition security rules
        run: firebase emulators:exec --only firestore --project demo-event-rule-security --config firebase.rules-test.json "python3.11 -m unittest discover -s tests/firestore"
