name: Claude Security Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

# Runs share the Claude subscription's usage limits, so drop reviews of superseded pushes.
concurrency:
  group: claude-security-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-security-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Security Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Perform a security review of this pull request. Read the diff with `gh pr diff`
            and read surrounding code as needed to confirm exploitability.

            Report only vulnerabilities introduced or made reachable by this PR that you are
            highly confident are exploitable. Focus on:
            - Authentication and authorization, including organiser ownership. The server must
              never trust client-supplied organiser or user identifiers.
            - Payments and Stripe flows: amount or price tampering, webhook verification,
              double-spend or race conditions in Firestore transactions.
            - Firestore and Storage security rules (`firestore.rules`, `storage.rules`).
            - Injection (command, query, template), XSS, SSRF, path traversal, unsafe
              deserialization.
            - Hardcoded secrets, credentials, or service-account material.
            - Sensitive data exposure, including personal data in logs or API responses.
            - GitHub Actions workflow changes: untrusted input in `run:` steps, overly broad
              permissions, secret exposure.

            Do not report: denial of service or resource exhaustion, missing rate limiting,
            open redirects, generic input validation without demonstrated impact, theoretical
            issues without a concrete attack path, findings in tests, or generated output under
            `frontend/public/`.

            For each finding, post an inline comment on the relevant diff line with
            `mcp__github_inline_comment__create_inline_comment`, starting with the severity
            (CRITICAL, HIGH, or MEDIUM), then the attack scenario and a concrete fix. Use
            `gh pr comment` only for a finding that cannot be anchored to a diff line.
            If there are no findings, post nothing.
          claude_args: '--model claude-sonnet-5-5 --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*)"'
